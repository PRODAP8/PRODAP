<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101110">
  <meta name="description" content="PRODAP — the personal site of AP.">
  <title>PRODAP — AP</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      color: #f4f4ef;
      background: #101110;
      --muted: #999c94;
      --line: #30332e;
      --accent: #d7f36b;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; min-height: 100vh; }
    a { color: inherit; text-decoration: none; }
    .wrap { width: min(1100px, calc(100% - 48px)); margin-inline: auto; }
    header { height: 76px; border-bottom: 1px solid var(--line); display: flex; align-items: center; }
    .bar { display: flex; justify-content: space-between; align-items: center; }
    .brand { font-size: 1.05rem; font-weight: 900; letter-spacing: .17em; }
    .brand span { color: var(--accent); }
    nav { display: flex; align-items: center; gap: 2rem; color: #c6c8c1; font-size: .86rem; }
    nav a:hover { color: var(--accent); }
    .hero { min-height: 470px; display: grid; align-content: center; padding-block: 5rem; position: relative; overflow: hidden; }
    .hero:after { content: ""; position: absolute; z-index: -1; right: 4%; top: 5%; width: 390px; height: 390px; border-radius: 50%; background: #d7f36b12; filter: blur(65px); }
    .eyebrow { color: var(--accent); font-size: .72rem; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; }
    h1 { margin: 1.2rem 0 1rem; font-size: clamp(4.5rem, 12vw, 8rem); letter-spacing: -.09em; line-height: .9; }
    h1 span { color: var(--accent); }
    .intro { color: #b7b9b2; max-width: 500px; font-size: 1.05rem; line-height: 1.75; }
    .button { display: inline-block; margin-top: 1.25rem; padding: .9rem 1.2rem; background: var(--accent); color: #151710; font-size: .76rem; font-weight: 850; letter-spacing: .06em; text-transform: uppercase; }
    .button:hover { background: #e4ff85; }
    .plugins { border-top: 1px solid var(--line); padding: 5rem 0 6rem; }
    .section-top { display: flex; justify-content: space-between; align-items: end; gap: 1.5rem; margin-bottom: 1.6rem; }
    h2 { margin: .55rem 0 0; font-size: clamp(2.3rem, 6vw, 4rem); letter-spacing: -.07em; }
    .section-note { color: var(--muted); font-size: .85rem; }
    .empty { min-height: 220px; border: 1px solid var(--line); background: linear-gradient(120deg, #191b18, #141513); display: grid; place-items: center; text-align: center; padding: 2rem; }
    .empty-icon { width: 48px; height: 48px; border: 1px solid #65695e; color: var(--accent); display: grid; place-items: center; font-size: 1.4rem; margin: 0 auto 1rem; }
    .empty h3 { margin: 0 0 .5rem; font-size: 1.1rem; }
    .empty p { margin: 0; color: var(--muted); font-size: .9rem; line-height: 1.6; }
    footer { border-top: 1px solid var(--line); color: var(--muted); padding: 1.4rem 0; font-size: .78rem; }
    .footer-inner { display: flex; justify-content: space-between; gap: 1rem; }
    @media (max-width: 600px) {
      header { height: 66px; }
      nav { gap: 1rem; font-size: .78rem; }
      .hero { min-height: 420px; }
      .section-top { align-items: start; flex-direction: column; }
      .footer-inner { flex-direction: column; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap bar">
      <a class="brand" href="#home" aria-label="PRODAP home">PROD<span>AP</span></a>
      <nav aria-label="Main navigation">
        <a href="#home">Home</a>
        <a href="#plugins">Plugins</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero wrap" id="home">
      <div>
        <div class="eyebrow">Welcome to PRODAP</div>
        <h1>Hey, I’m<br><span>AP.</span></h1>
        <p class="intro">A clean space for my work and plugins. More coming soon.</p>
        <a class="button" href="#plugins">Explore plugins&nbsp; ↓</a>
      </div>
    </section>

    <section class="plugins" id="plugins">
      <div class="wrap">
        <div class="section-top">
          <div>
            <div class="eyebrow">The collection</div>
            <h2>Plugins</h2>
          </div>
          <div class="section-note">A home for my plugins.</div>
        </div>
        <div class="empty">
          <div>
            <div class="empty-icon" aria-hidden="true">+</div>
            <h3>Plugins will be added here</h3>
            <p>This section is ready for your plugin list.</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap footer-inner"><span>© 2026 PRODAP</span><span>Made by AP</span></div>
  </footer>
</body>
</html>
